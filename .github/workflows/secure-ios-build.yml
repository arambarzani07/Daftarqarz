name: Secure iOS Build Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/secure-ios-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish one-time build public key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/build-private.pem
          openssl rsa -pubout -in /tmp/build-private.pem -out .build-public.pem
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .build-public.pem
          git commit -m 'ci: publish one-time encrypted build key'
          git push origin HEAD:main

      - name: Wait for encrypted private source bundle
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            git fetch origin main
            git checkout origin/main -- .build-source.enc .build-key.enc 2>/dev/null || true
            if [ -s .build-source.enc ] && [ -s .build-key.enc ]; then
              echo 'Encrypted source bundle received.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for encrypted source.' >&2
          exit 1

      - name: Decrypt source only inside ephemeral runner
        run: |
          set -euo pipefail
          openssl pkeyutl -decrypt -inkey /tmp/build-private.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -in .build-key.enc -out /tmp/build-passphrase.txt
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass file:/tmp/build-passphrase.txt \
            -in .build-source.enc -out /tmp/source.tar.gz
          mkdir -p private-source
          tar -xzf /tmp/source.tar.gz -C private-source
          test -f private-source/pubspec.yaml
          test -f private-source/lib/main.dart
          rm -f /tmp/source.tar.gz /tmp/build-passphrase.txt

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS shell and restore legacy identity
        working-directory: private-source
        run: |
          set -euo pipefail
          flutter create --platforms=ios --org com.void --project-name daftr_qarz .
          rm -f test/widget_test.dart
          PBXPROJ='ios/Runner.xcodeproj/project.pbxproj'
          PLIST='ios/Runner/Info.plist'
          ENTITLEMENTS='ios/Runner/Runner.entitlements'
          FIREBASE_PLIST='firebase/GoogleService-Info.plist'
          test -f "$FIREBASE_PLIST"
          perl -0pi -e 's/PRODUCT_BUNDLE_IDENTIFIER = com\.void\.daftrQarz;/PRODUCT_BUNDLE_IDENTIFIER = com.void.daftarQarz;/g; s/PRODUCT_BUNDLE_IDENTIFIER = com\.void\.daftr_qarz;/PRODUCT_BUNDLE_IDENTIFIER = com.void.daftarQarz;/g' "$PBXPROJ"
          perl -0pi -e 's/(PRODUCT_BUNDLE_IDENTIFIER = com\.void\.daftarQarz;)/$1\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner\/Runner.entitlements;\n\t\t\t\tDEVELOPMENT_TEAM = TJSRQ2GZMU;/g' "$PBXPROJ"
          perl -0pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g' "$PBXPROJ"
          /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes array' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes:0 string fetch' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes:1 string remote-notification' "$PLIST" 2>/dev/null || true
          cat > "$ENTITLEMENTS" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
          </dict>
          </plist>
          EOF
          cp "$FIREBASE_PLIST" ios/Runner/GoogleService-Info.plist

      - name: Analyze and test reconstructed source
        working-directory: private-source
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test

      - name: Build unsigned push-ready iOS app
        working-directory: private-source
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          APP='build/ios/iphoneos/Runner.app'
          test -d "$APP"
          cp firebase/GoogleService-Info.plist "$APP/GoogleService-Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = 'com.void.daftarQarz'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = '0.2.7'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = '24'
          test "$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' "$APP/GoogleService-Info.plist")" = 'dafterqarz'
          test "$(/usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' "$APP/GoogleService-Info.plist")" = '1:308705635892:ios:c76aa9e6cb84662f4a2461'
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist" | grep -q 'remote-notification'

      - name: Package and publish IPA
        working-directory: private-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf build/secure-ipa
          mkdir -p build/secure-ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/secure-ipa/Payload/Runner.app
          cp ios/Runner/Runner.entitlements build/secure-ipa/Daftarqarzsafeen.entitlements.plist
          (cd build/secure-ipa && zip -qry ../Daftarqarzsafeen-0.2.7-build24-push-ready.ipa Payload)
          shasum -a 256 build/Daftarqarzsafeen-0.2.7-build24-push-ready.ipa
          gh release upload daftarqarz-latest \
            build/Daftarqarzsafeen-0.2.7-build24-push-ready.ipa \
            build/secure-ipa/Daftarqarzsafeen.entitlements.plist \
            --clobber

      - name: Remove exchange files from current public branch
        if: always()
        run: |
          set +e
          git fetch origin main
          git checkout -B cleanup origin/main
          git rm -f .build-public.pem .build-source.enc .build-key.enc 2>/dev/null
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'ci: remove encrypted build exchange files'
            git push origin HEAD:main
          fi
