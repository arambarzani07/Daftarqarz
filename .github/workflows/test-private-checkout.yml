name: Test private checkout access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-private-checkout.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test sibling private checkout
        uses: actions/checkout@v4
        with:
          repository: arambarzani07/Daftarqarzsafeen
          ref: 7a08655f2006a673014207df70a348f215cceb23
          token: ${{ github.token }}
          path: private-source
      - name: Verify without exposing source
        run: |
          test -f private-source/source/pubspec.yaml
          git -C private-source rev-parse HEAD
