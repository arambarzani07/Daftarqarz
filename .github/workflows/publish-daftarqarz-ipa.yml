name: Publish Daftar Qarz IPA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-daftarqarz-ipa.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download IPA
        env:
          IPA_SOURCE: 'https://uc420ae1688fb42f52fd79b7f58e.dl.dropboxusercontent.com/cd/0/get/DIIzs_5q4RZvaGryat9Z8-f4d2yurX94IVzaUkNDm9rbRxj0rt_1TmZRsNLMIR_Uep7PCCeHNO6bsC3vePaZHBVjgPcOBuqYFniYH3kAvSQNxfmW_Y5ByNO21gv14yBOaxvZr15aZvhUy6JW0lNj3iwjCvDVLW1mI0WspHGlSqy0XQ/file?c_luid=0d2afbfd'
        run: |
          set -euo pipefail
          curl -fL --retry 2 "$IPA_SOURCE" -o Daftarqarzsafeen.ipa
          echo '6b0e434f0125cec5a0d57c0b45bac686e35f8be04678f11c57842b120a530b9e  Daftarqarzsafeen.ipa' | sha256sum -c -

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view daftarqarz-latest >/dev/null 2>&1; then
            gh release create daftarqarz-latest --title 'Daftar Qarz - Latest' --notes 'Safari-downloadable IPA build.'
          fi
          gh release upload daftarqarz-latest Daftarqarzsafeen.ipa --clobber
